id = "drop_physics"
name = "Drop Physics"
version = "1.0.3"
description = "Physics for dropped items: they tumble while they fly and settle on their flattest side, with no bobbing or spinning."
authors = ["foudretbr"]
license = "LGPL-3.0-or-later"
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "8f83e5c85ae3b9a117f742e8d91170c5c9080a06"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.mixin]]
id = "items"
kind = "OVERWRITE"
target = "horizon_client::game::item_draw::Game<'_>::dropped_item_geometry"
helper = "src/mixins/items.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "alpha", ty = "f64", value = "alpha" },
  { name = "out", ty = "&mut Vec<Vertex>", value = "&mut *out" },
]



